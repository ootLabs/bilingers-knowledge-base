name: CI

# Every pull request has to prove the project still starts and still passes.
# The smoke job is the one that answers "but it works on my machine".

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Map matches the repository
        run: python scripts/check_map.py

      - name: No banned typographic characters
        run: python scripts/check_text.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bilingers
          POSTGRES_PASSWORD: bilingers
          POSTGRES_DB: bilingers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilingers -d bilingers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://bilingers:bilingers@localhost:5432/bilingers
      PGPASSWORD: bilingers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # A GitHub service container does not run db/init, so it is applied here.
      # This also proves the bootstrap SQL is valid before anyone ships it.
      - name: Apply database bootstrap
        run: |
          for file in db/init/*.sql; do
            echo "applying $file"
            psql -h localhost -U bilingers -d bilingers -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Production build
        run: npm run build

  smoke:
    name: Stack smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create environment file
        run: cp .env.example .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Smoke test
        run: python scripts/smoke_test.py

      # Without this, a red smoke job tells you nothing about why.
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
