# Alembic owns every application table. db/init/ stays what it was: the
# container bootstrap that runs once on an empty volume and holds only the
# health probe. Schema changes go here, never there.

[alembic]
script_location = alembic
# Makes the `app` package importable when alembic runs from backend/.
prepend_sys_path = .
# Date in the filename, hash in the revision id. Two people branching from the
# same head both reach for the same next number, and a duplicate revision id is
# only a UserWarning in Alembic: one of the two migrations then vanishes from
# the history and its tables are silently never created. The date keeps the
# directory sorting chronologically, which is the one thing numbering was good
# for. `alembic revision` generates the id itself; never hand-write one.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url is deliberately absent. env.py reads DATABASE_URL through
# app.config, so the connection string lives in exactly one place and no
# credential is ever committed here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
