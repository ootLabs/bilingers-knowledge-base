[pytest]
testpaths = tests
# Makes the `app` package importable without installing it.
pythonpath = .
addopts =
    -q
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=90

markers =
    integration: needs a reachable PostgreSQL instance; deselect with -m "not integration"
